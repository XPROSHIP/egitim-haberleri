<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Çorum MESEM — Vektörel Logo Görüntüleyici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #fdfbf7;
      --ui-bg: rgba(19, 38, 66, 0.92);
      --ui-border: rgba(255, 255, 255, 0.14);
      --ui-text: #f8fafc;
      --accent: #c4511b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-canvas);
      user-select: none;
    }

    #stage-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-canvas);
      transition: background 0.2s ease;
    }

    #stage-wrap.dark {
      background: #0b1220;
    }

    #stage-wrap.grid {
      background-color: #ffffff;
      background-image:
        linear-gradient(45deg, #eaeef3 25%, transparent 25%),
        linear-gradient(-45deg, #eaeef3 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #eaeef3 75%),
        linear-gradient(-45deg, transparent 75%, #eaeef3 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    }

    #stage {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }

    #stage:active {
      cursor: grabbing;
    }

    .toolbar {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 10px;
      max-width: calc(100vw - 20px);
      background: var(--ui-bg);
      border: 1px solid var(--ui-border);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.24);
      z-index: 20;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sep {
      width: 1px;
      height: 22px;
      background: var(--ui-border);
      margin: 0 2px;
    }

    button {
      appearance: none;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.08);
      color: var(--ui-text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    button.active {
      background: var(--accent);
      color: #ffffff;
    }

    button.dl {
      background: rgba(196, 81, 27, 0.22);
      border-color: rgba(196, 81, 27, 0.5);
    }

    button.dl:hover {
      background: var(--accent);
    }

    .zoom-badge {
      min-width: 68px;
      text-align: center;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      padding: 0 4px;
    }

    .hint {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(19, 38, 66, 0.78);
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 500;
      pointer-events: none;
      white-space: nowrap;
      backdrop-filter: blur(6px);
      z-index: 10;
    }

    @media (max-width: 640px) {
      .toolbar {
        bottom: 10px;
        padding: 7px 8px;
        gap: 5px;
      }
      button {
        font-size: 11px;
        padding: 6px 8px;
      }
      .sep {
        display: none;
      }
      .hint {
        font-size: 10px;
        top: 8px;
      }
    }
  </style>
</head>

  <script>
    (() => {
      const svg = document.getElementById('stage');
      const wrap = document.getElementById('stage-wrap');
      const readout = document.getElementById('zoom-readout');

      const VIEWS = {
        all:    { x: -30,  y: -425, w: 1060, h: 1020 },
        top:    { x: 400,  y: -405, w: 200,  h: 200  },
        bottom: { x: 40,   y: -170, w: 920,  h: 760  },
        emblem: { x: 95,   y: 5,    w: 810,  h: 575  }
      };

      let currentPreset = 'all';
      let baseWidth = VIEWS.all.w;
      let vb = { ...VIEWS.all };

      const MIN_WIDTH = 0.005;   // ~200,000x sonsuz zoom sınırı
      const MAX_WIDTH = 50000;

      function applyViewBox() {
        svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
        const pct = Math.round((baseWidth / vb.w) * 100);
        readout.textContent = pct >= 10000 ? `${(pct / 1000).toFixed(1)}k%` : `${pct}%`;
      }

      function fitPreset(name) {
        currentPreset = name;
        const target = VIEWS[name];
        const rect = svg.getBoundingClientRect();
        const screenRatio = rect.width / Math.max(1, rect.height);
        const targetRatio = target.w / target.h;

        let w = target.w;
        let h = target.h;
        let x = target.x;
        let y = target.y;

        if (screenRatio > targetRatio) {
          w = h * screenRatio;
          x = target.x - (w - target.w) / 2;
        } else {
          h = w / screenRatio;
          y = target.y - (h - target.h) / 2;
        }

        baseWidth = w;
        vb = { x, y, w, h };
        applyViewBox();

        document.querySelectorAll('.view-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.view === name);
        });
      }

      function clientToSvg(clientX, clientY) {
        const rect = svg.getBoundingClientRect();
        const rx = (clientX - rect.left) / Math.max(1, rect.width);
        const ry = (clientY - rect.top) / Math.max(1, rect.height);
        return {
          x: vb.x + rx * vb.w,
          y: vb.y + ry * vb.h,
          rx,
          ry
        };
      }

      function zoomAt(factor, clientX, clientY) {
        const pt = clientToSvg(clientX, clientY);
        const nextW = Math.min(MAX_WIDTH, Math.max(MIN_WIDTH, vb.w * factor));
        const actualFactor = nextW / vb.w;
        const nextH = vb.h * actualFactor;

        vb.x = pt.x - pt.rx * nextW;
        vb.y = pt.y - pt.ry * nextH;
        vb.w = nextW;
        vb.h = nextH;
        applyViewBox();
      }

      // Fare tekerleği ile imleç odaklı sonsuz zoom
      svg.addEventListener('wheel', (e) => {
        e.preventDefault();
        const intensity = e.ctrlKey ? 0.012 : 0.0018;
        const factor = Math.exp(e.deltaY * intensity);
        zoomAt(factor, e.clientX, e.clientY);
      }, { passive: false });

      // Çift tıklama ile zoom
      svg.addEventListener('dblclick', (e) => {
        e.preventDefault();
        zoomAt(e.shiftKey ? 2 : 0.45, e.clientX, e.clientY);
      });

      // Pointer Events ile hem masaüstü sürükle hem mobil tek/çift parmak pinch-zoom
      const pointers = new Map();
      let lastPinchDist = null;
      let lastCenter = null;

      function getPinchState() {
        const pts = Array.from(pointers.values());
        if (pts.length === 1) {
          return { dist: null, cx: pts[0].x, cy: pts[0].y };
        }
        const dx = pts[1].x - pts[0].x;
        const dy = pts[1].y - pts[0].y;
        return {
          dist: Math.hypot(dx, dy),
          cx: (pts[0].x + pts[1].x) / 2,
          cy: (pts[0].y + pts[1].y) / 2
        };
      }

      svg.addEventListener('pointerdown', (e) => {
        svg.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        const st = getPinchState();
        lastPinchDist = st.dist;
        lastCenter = { x: st.cx, y: st.cy };
      });

      svg.addEventListener('pointermove', (e) => {
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        const st = getPinchState();
        const rect = svg.getBoundingClientRect();

        if (lastCenter) {
          const dxPx = st.cx - lastCenter.x;
          const dyPx = st.cy - lastCenter.y;
          vb.x -= (dxPx / Math.max(1, rect.width)) * vb.w;
          vb.y -= (dyPx / Math.max(1, rect.height)) * vb.h;
        }

        if (st.dist && lastPinchDist && lastPinchDist > 0) {
          const factor = lastPinchDist / st.dist;
          zoomAt(factor, st.cx, st.cy);
        } else {
          applyViewBox();
        }

        lastPinchDist = st.dist;
        lastCenter = { x: st.cx, y: st.cy };
      });

      function dropPointer(e) {
        pointers.delete(e.pointerId);
        if (pointers.size === 0) {
          lastPinchDist = null;
          lastCenter = null;
        } else {
          const st = getPinchState();
          lastPinchDist = st.dist;
          lastCenter = { x: st.cx, y: st.cy };
        }
      }

      svg.addEventListener('pointerup', dropPointer);
      svg.addEventListener('pointercancel', dropPointer);

      // Buton kontrolleri
      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', () => fitPreset(btn.dataset.view));
      });

      document.getElementById('zoom-in').addEventListener('click', () => {
        const r = svg.getBoundingClientRect();
        zoomAt(0.65, r.left + r.width / 2, r.top + r.height / 2);
      });

      document.getElementById('zoom-out').addEventListener('click', () => {
        const r = svg.getBoundingClientRect();
        zoomAt(1.5, r.left + r.width / 2, r.top + r.height / 2);
      });

      document.getElementById('zoom-reset').addEventListener('click', () => fitPreset(currentPreset));

      // Arka plan modu (şeffaf alanları doğrulamak için)
      const bgModes = [
        { cls: '', label: 'Zemin: Açık' },
        { cls: 'grid', label: 'Zemin: Şeffaf' },
        { cls: 'dark', label: 'Zemin: Koyu' }
      ];
      let bgIdx = 0;
      const bgBtn = document.getElementById('bg-toggle');
      bgBtn.addEventListener('click', () => {
        bgIdx = (bgIdx + 1) % bgModes.length;
        wrap.className = bgModes[bgIdx].cls;
        bgBtn.textContent = bgModes[bgIdx].label;
      });

      // Klavye kısayolları
      window.addEventListener('keydown', (e) => {
        const r = svg.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        if (e.key === '+' || e.key === '=') zoomAt(0.75, cx, cy);
        else if (e.key === '-') zoomAt(1.33, cx, cy);
        else if (e.key === '0') fitPreset(currentPreset);
      });

      // Tek tıkla bağımsız .svg dosyası indirme
      function downloadSvg(mode) {
        const defs = svg.querySelector('defs').cloneNode(true);
        const out = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        out.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        out.appendChild(defs);

        let filename = 'corum-mesem.svg';
        if (mode === 'top') {
          filename = 'corum-mesem-dairesel-logo.svg';
          out.setAttribute('viewBox', '0 0 400 400');
          const g = document.getElementById('top-logo-group').cloneNode(true);
          g.removeAttribute('transform');
          out.appendChild(g);
        } else if (mode === 'bottom') {
          filename = 'corum-mesem-2renkli-logo.svg';
          out.setAttribute('viewBox', '70 -165 860 740');
          const g = document.getElementById('bottom-full-group').cloneNode(true);
          out.appendChild(g);
        } else {
          filename = 'corum-mesem-amblem.svg';
          out.setAttribute('viewBox', '105 15 790 555');
          const g = document.getElementById('bottom-emblem-group').cloneNode(true);
          out.appendChild(g);
        }

        const serializer = new XMLSerializer();
        const source = '<?xml version="1.0" encoding="UTF-8"?>\n' + serializer.serializeToString(out);
        const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      document.querySelectorAll('.dl').forEach(btn => {
        btn.addEventListener('click', () => downloadSvg(btn.dataset.export));
      });

      window.addEventListener('resize', () => fitPreset(currentPreset));
      fitPreset('all');
    })();
  </script>
</body>
</html>
