<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        try {
          // Ayarlar "eh.state.v1" altında tek JSON olarak tutuluyor.
          var raw = localStorage.getItem('eh.state.v1');
          var s = raw ? JSON.parse(raw) : {};
          var t = s.theme || 'system';
          if (t === 'system') {
            var m = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
            t = (m && m.matches) ? 'light' : 'dark';
          }
          var root = document.documentElement;
          root.classList.remove('dark', 'light', 'sepia');
          root.classList.add(t);
          root.dataset.theme = t;
          if (s.readerFont) root.dataset.readerFont = s.readerFont;
          if (s.readerWidth) root.dataset.readerWidth = s.readerWidth;
          if (s.readerLine) root.dataset.readerLine = s.readerLine;
          // Yazı boyutu ölçeği (rem tabanlı metinler büyür).
          var pct = { '1': 100, '1.25': 106, '1.5': 112 }[s.fontScale] || 100;
          if (pct !== 100) root.style.fontSize = pct + '%';
        } catch (e) {}
      })();
    </script>
