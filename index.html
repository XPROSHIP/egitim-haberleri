<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'system') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
          var fs = localStorage.getItem('font_scale');
          if (fs === '1.25' || fs === '1.5') {
            document.documentElement.style.fontSize = (parseFloat(fs) * 100) + '%';
          }
          var c = localStorage.getItem('consent');
          if (c) document.documentElement.dataset.consent = c;
        } catch (e) {}
      })();
    </script>
    <title>Eğitim Haberleri — Mesleki Eğitim, MEB ve Çorum Eğitim Gündemi</title>
