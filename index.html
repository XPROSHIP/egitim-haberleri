<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        try {
          // Ayarlar "eh.state.v1" altında tek JSON olarak tutuluyor.
          var raw = localStorage.getItem('eh.state.v1');
          var s = raw ? JSON.parse(raw) : {};
          var t = s.theme || 'system';
          if (t === 'system') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
          // Yazı boyutu ölçeği (rem tabanlı metinler büyür).
          var pct = { '1': 100, '1.25': 106, '1.5': 112 }[s.fontScale] || 100;
          if (pct !== 100) document.documentElement.style.fontSize = pct + '%';
        } catch (e) {}
      })();
    </script>
    <title>Eğitim Haberleri — Mesleki Eğitim, MEB ve Çorum Eğitim Gündemi</title>
    <meta name="description" content="Mesleki Eğitim, MESEM, MEB, Çorum Eğitim, Ortaöğretim, Maarif Modeli ve yabancı eğitim gündeminden güncel haberler." />
