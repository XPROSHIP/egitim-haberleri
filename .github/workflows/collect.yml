# 3 saatte bir haber toplar, görselleri ve kayıtları Worker'a gönderir.
# Siteye girmek, bilgisayarın açık olması gerekmez.
name: Haber topla

on:
  schedule:
    # dakikada 0, 3, 6, 9, 12, 15, 18, 21 saatlerinde çalışır (UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

# Toplanan haberleri depoya geri yazabilmek için gerekli.
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Haberleri topla ve yayınla
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          COLLECT_SECRET: ${{ secrets.COLLECT_SECRET }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: node worker/scripts/collect-ci.mjs

      - name: Toplanan haberleri depoya kaydet
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/collected.json
          # Her koşuda aynı dosya değişmiş görünmesin diye yalnızca gerçekten
          # fark varsa commit yapılır.
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "chore: haber toplama ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            # Depoda aynı anda başka bir commit olabilir (elle push).
            # Çakışmada yeniden denenir; veri zaten D1'de olduğu için
            # başarısızlık iş akışını durdurmaz.
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then
                echo "push tamam"; break
              fi
              git rebase --abort || true
              sleep 5
            done
            git push || echo "push yapılamadı, veri D1'de kayıtlı"
          fi

      # --- Ses üretim politikasının denetimi (hızlı, ücretsiz) ---
      - name: Okuma tarifi politikasını doğrula
        run: python worker/scripts/test_recipe.py

      # --- Ses sentezi (EMA Lightning) ---
      # Yeni haberlerin tam metni Türkçe sese çevrilir ve Worker'a yüklenir.
      # Site, sesi varsa onu çalar; yoksa tarayıcının kendi TTS'ine düşer.

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: worker/requirements-tts.txt

      - name: Model ağırlıklarını önbelleğe al
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ema-lightning-v1

      - name: EMA Lightning kur
        run: |
          python -m pip install --disable-pip-version-check -r worker/requirements-tts.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Haberleri sese çevir
        env:
          COLLECT_SECRET: ${{ secrets.COLLECT_SECRET }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: python worker/scripts/tts_generate.py

      # --- ZENPOD Eğitim: günlük ses bülteni ---
      - name: Günlük podcast bölümü hazırla
        env:
          COLLECT_SECRET: ${{ secrets.COLLECT_SECRET }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python worker/scripts/podcast_generate.py

      # --- Web push: yeni haberleri abonelere bildir ---
      - name: Bildirimleri gönder
        env:
          COLLECT_SECRET: ${{ secrets.COLLECT_SECRET }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: node worker/scripts/push-notify.mjs

      - name: Ses durumunu depoya kaydet
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/collected.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "chore: ses sentezi ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then
                echo "push tamam"; break
              fi
              git rebase --abort || true
              sleep 5
            done
            git push || echo "push yapılamadı, veri D1'de kayıtlı"
          fi